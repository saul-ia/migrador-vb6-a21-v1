<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>VB6 Dependency Graph</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body { font-family: system-ui; background: #0f0f23; color: #e8e8e8; margin: 0; }
        #graph { width: 100vw; height: 100vh; }
        .node { cursor: pointer; }
        .node-form { fill: #00d4ff; }
        .node-module { fill: #7b2cbf; }
        .node-class { fill: #00ff88; }
        .node-control { fill: #ffcc00; }
        .link { stroke: #555; stroke-opacity: 0.6; }
        .link-calls { stroke: #00d4ff; }
        .link-shows { stroke: #ff4444; }
        text { fill: #fff; font-size: 10px; }
        .legend { position: fixed; top: 20px; right: 20px; background: rgba(0,0,0,0.8); padding: 15px; border-radius: 8px; }
        .legend div { margin: 5px 0; }
        .legend span { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 8px; }
        h3 { margin: 0 0 10px 0; color: #00d4ff; }
    </style>
</head>
<body>
    <div id="graph"></div>
    <div class="legend">
        <h3>📊 Dependency Graph</h3>
        <div><span style="background:#00d4ff"></span>Form</div>
        <div><span style="background:#7b2cbf"></span>Module</div>
        <div><span style="background:#00ff88"></span>Class</div>
        <div><span style="background:#ffcc00"></span>Control</div>
        <hr style="border-color:#333">
        <div>Nodes: 9</div>
        <div>Edges: 16</div>
        <div>Cycles: 0</div>
    </div>
    <script>
        const data = {"summary": {"total_nodes": 9, "total_edges": 16, "forms": 8, "modules": 1, "classes": 0, "circular_dependencies": 0}, "nodes": [{"id": "form1", "type": "Form", "file": "Form1.frm"}, {"id": "form2", "type": "Form", "file": "Form2.frm"}, {"id": "form7", "type": "Form", "file": "FORM7.FRM"}, {"id": "frmayuda", "type": "Form", "file": "frmAYUDA.frm"}, {"id": "frmcli", "type": "Form", "file": "FRMCLI.FRM"}, {"id": "frmlib", "type": "Form", "file": "FRMLIB.FRM"}, {"id": "frmpres", "type": "Form", "file": "FrmPres.frm"}, {"id": "mdiform1", "type": "Form", "file": "MDIForm1.frm"}, {"id": "module1", "type": "Module", "file": "Module1.bas"}], "edges": [{"source": "frmcli", "target": "frmayuda", "type": "references", "count": 1}, {"source": "frmcli", "target": "frmayuda", "type": "shows", "count": 1}, {"source": "frmlib", "target": "frmpres", "type": "references", "count": 3}, {"source": "frmlib", "target": "frmayuda", "type": "references", "count": 1}, {"source": "frmlib", "target": "frmpres", "type": "shows", "count": 1}, {"source": "frmlib", "target": "frmayuda", "type": "shows", "count": 1}, {"source": "frmpres", "target": "frmayuda", "type": "references", "count": 1}, {"source": "frmpres", "target": "frmayuda", "type": "shows", "count": 1}, {"source": "mdiform1", "target": "frmayuda", "type": "references", "count": 1}, {"source": "mdiform1", "target": "frmlib", "type": "references", "count": 5}, {"source": "mdiform1", "target": "frmcli", "type": "references", "count": 1}, {"source": "mdiform1", "target": "frmayuda", "type": "shows", "count": 1}, {"source": "mdiform1", "target": "form2", "type": "shows", "count": 1}, {"source": "mdiform1", "target": "frmlib", "type": "shows", "count": 2}, {"source": "mdiform1", "target": "form1", "type": "shows", "count": 1}, {"source": "mdiform1", "target": "frmcli", "type": "shows", "count": 1}], "circular_dependencies": [], "hub_modules": [{"name": "frmlib", "type": "Form", "incoming": 7, "outgoing": 6, "total": 13, "recommendation": "Migrate early - many dependents"}, {"name": "mdiform1", "type": "Form", "incoming": 0, "outgoing": 13, "total": 13, "recommendation": "Complex - many dependencies"}, {"name": "frmayuda", "type": "Form", "incoming": 8, "outgoing": 0, "total": 8, "recommendation": "Migrate early - many dependents"}, {"name": "frmpres", "type": "Form", "incoming": 4, "outgoing": 2, "total": 6, "recommendation": "Migrate early - many dependents"}, {"name": "frmcli", "type": "Form", "incoming": 2, "outgoing": 2, "total": 4, "recommendation": "Complex - many dependencies"}]};
        
        const width = window.innerWidth;
        const height = window.innerHeight;
        
        const svg = d3.select("#graph").append("svg")
            .attr("width", width)
            .attr("height", height);
        
        const simulation = d3.forceSimulation(data.nodes)
            .force("link", d3.forceLink(data.edges).id(d => d.id).distance(100))
            .force("charge", d3.forceManyBody().strength(-300))
            .force("center", d3.forceCenter(width / 2, height / 2));
        
        const link = svg.append("g")
            .selectAll("line")
            .data(data.edges)
            .join("line")
            .attr("class", d => "link link-" + d.type)
            .attr("stroke-width", d => Math.min(d.count, 5));
        
        const node = svg.append("g")
            .selectAll("circle")
            .data(data.nodes)
            .join("circle")
            .attr("class", d => "node node-" + d.type.toLowerCase())
            .attr("r", d => 8 + (data.edges.filter(e => e.target.id === d.id || e.source.id === d.id).length * 2))
            .call(d3.drag()
                .on("start", dragstarted)
                .on("drag", dragged)
                .on("end", dragended));
        
        const text = svg.append("g")
            .selectAll("text")
            .data(data.nodes)
            .join("text")
            .text(d => d.id)
            .attr("dx", 12)
            .attr("dy", 4);
        
        simulation.on("tick", () => {
            link.attr("x1", d => d.source.x)
                .attr("y1", d => d.source.y)
                .attr("x2", d => d.target.x)
                .attr("y2", d => d.target.y);
            node.attr("cx", d => d.x).attr("cy", d => d.y);
            text.attr("x", d => d.x).attr("y", d => d.y);
        });
        
        function dragstarted(event) {
            if (!event.active) simulation.alphaTarget(0.3).restart();
            event.subject.fx = event.subject.x;
            event.subject.fy = event.subject.y;
        }
        function dragged(event) {
            event.subject.fx = event.x;
            event.subject.fy = event.y;
        }
        function dragended(event) {
            if (!event.active) simulation.alphaTarget(0);
            event.subject.fx = null;
            event.subject.fy = null;
        }
    </script>
</body>
</html>
