<div class="form-container">
    <mat-card>
        <mat-card-header>
            <mat-card-title>Gestión de Socios</mat-card-title>
            <mat-card-subtitle>Listado de Miembros (Backend Integrated)</mat-card-subtitle>
        </mat-card-header>
        <mat-card-content>

            <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">

                <!-- Id Column -->
                <ng-container matColumnDef="Id">
                    <th mat-header-cell *matHeaderCellDef> No. </th>
                    <td mat-cell *matCellDef="let element"> {{element.Id}} </td>
                </ng-container>

                <!-- Nombre Column -->
                <ng-container matColumnDef="Nombre">
                    <th mat-header-cell *matHeaderCellDef> Nombre </th>
                    <td mat-cell *matCellDef="let element"> {{element.Nombre}} </td>
                </ng-container>

                <!-- Apellido Column -->
                <ng-container matColumnDef="Apellido">
                    <th mat-header-cell *matHeaderCellDef> Apellido </th>
                    <td mat-cell *matCellDef="let element"> {{element.Apellido}} </td>
                </ng-container>

                <!-- DNI Column -->
                <ng-container matColumnDef="DNI">
                    <th mat-header-cell *matHeaderCellDef> DNI </th>
                    <td mat-cell *matCellDef="let element"> {{element.DNI}} </td>
                </ng-container>

                <!-- Telefono Column -->
                <ng-container matColumnDef="Telefono">
                    <th mat-header-cell *matHeaderCellDef> Teléfono </th>
                    <td mat-cell *matCellDef="let element"> {{element.Telefono}} </td>
                </ng-container>

                <!-- Acciones Column -->
                <ng-container matColumnDef="Acciones">
                    <th mat-header-cell *matHeaderCellDef> Acciones </th>
                    <td mat-cell *matCellDef="let element">
                        <button mat-icon-button color="primary" (click)="openDialog(element)">
                            <mat-icon fontSet="material-symbols-rounded">edit</mat-icon>
                        </button>
                        <button mat-icon-button color="warn" (click)="deleteSocio(element.Id)">
                            <mat-icon fontSet="material-symbols-rounded">delete</mat-icon>
                        </button>
                    </td>
                </ng-container>

                <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
            </table>

        </mat-card-content>
        <mat-card-actions align="end">
            <button mat-raised-button color="primary" (click)="openDialog()">
                <mat-icon fontSet="material-symbols-rounded">person_add</mat-icon>
                Nuevo Socio
            </button>
        </mat-card-actions>
    </mat-card>
</div>
