<div class="form-container">
    <mat-card>
        <mat-card-header>
            <mat-card-title>Gestión de Libros (Form1 Migration)</mat-card-title>
            <mat-card-subtitle>Vista migrada de Form1.frm</mat-card-subtitle>
        </mat-card-header>
        <mat-card-content>

            <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">

                <!-- Id Column -->
                <ng-container matColumnDef="Id">
                    <th mat-header-cell *matHeaderCellDef> No. </th>
                    <td mat-cell *matCellDef="let element"> {{element.Id}} </td>
                </ng-container>

                <!-- Titulo Column -->
                <ng-container matColumnDef="Titulo">
                    <th mat-header-cell *matHeaderCellDef> Título </th>
                    <td mat-cell *matCellDef="let element"> {{element.Titulo}} </td>
                </ng-container>

                <!-- Autor Column -->
                <ng-container matColumnDef="Autor">
                    <th mat-header-cell *matHeaderCellDef> Autor </th>
                    <td mat-cell *matCellDef="let element"> {{element.Autor}} </td>
                </ng-container>

                <!-- Estado Column -->
                <ng-container matColumnDef="Estado">
                    <th mat-header-cell *matHeaderCellDef> Estado </th>
                    <td mat-cell *matCellDef="let element">
                        <span [style.color]="element.Estado === 'Disponible' ? 'green' : 'orange'">
                            {{element.Estado}}
                        </span>
                    </td>
                </ng-container>

                <!-- Acciones Column -->
                <ng-container matColumnDef="Acciones">
                    <th mat-header-cell *matHeaderCellDef> Acciones </th>
                    <td mat-cell *matCellDef="let element">
                        <button mat-icon-button color="primary" (click)="openDialog(element)">
                            <mat-icon fontSet="material-symbols-rounded">edit</mat-icon>
                        </button>
                        <button mat-icon-button color="warn" (click)="deleteLibro(element.Id)">
                            <mat-icon fontSet="material-symbols-rounded">delete</mat-icon>
                        </button>
                    </td>
                </ng-container>

                <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
            </table>

        </mat-card-content>
        <mat-card-actions align="end">
            <button mat-raised-button color="primary" (click)="openDialog()">
                <mat-icon fontSet="material-symbols-rounded">add</mat-icon>
                Nuevo Libro
            </button>
        </mat-card-actions>
    </mat-card>
</div>
